<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Colony Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #070b12; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        
        #ui-top { position: absolute; top: 0; left: 0; width: 100%; background: rgba(13, 20, 35, 0.95); border-bottom: 2px solid #00f0ff; padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; z-index: 10; box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15); }
        .stat { border-right: 1px solid #1e293b; }
        .stat:last-child { border: none; }
        .stat-val { font-size: 1.2rem; color: #00f0ff; margin-top: 5px; }
        .alerta { color: #ff4a4a !important; animation: piscar 1s infinite; }

        #container { display: flex; width: 100vw; height: 100vh; pt: 70px; }
        #canvas-container { flex-grow: 1; height: 100%; position: relative; background: radial-gradient(circle, #111827 0%, #030712 100%); }
        canvas { display: block; width: 100%; height: 100%; }

        #sidebar { width: 320px; background: rgba(13, 20, 35, 0.95); border-left: 2px solid #00f0ff; padding: 85px 15px 15px 15px; display: flex; flex-direction: column; gap: 12px; z-index: 5; overflow-y: auto; }
        h3 { color: #00f0ff; text-transform: uppercase; font-size: 0.95rem; border-bottom: 1px solid #1e293b; padding-bottom: 5px; margin-top: 5px; }
        
        .btn-build { background: #111c30; border: 1px solid #38bdf8; color: #e2e8f0; padding: 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; font-family: inherit; transition: all 0.2s; }
        .btn-build:hover { background: #1b2e4b; border-color: #00f0ff; box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
        .btn-build.selected { background: #00f0ff; color: #070b12; font-weight: bold; border-color: #fff; }
        .btn-desc { font-size: 0.75rem; opacity: 0.8; }
        .btn-cost { font-size: 0.75rem; color: #eab308; font-weight: bold; }
        .btn-build.selected .btn-cost { color: #070b12; }

        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="ui-top">
        <div class="stat">🪙 CRÉDITOS<div id="val-creditos" class="stat-val">$1000</div></div>
        <div class="stat">👥 POPULAÇÃO<div id="val-pop" class="stat-val">0</div></div>
        <div class="stat">⚡ ENERGIA<div id="val-energia" class="stat-val">0 / 0</div></div>
        <div class="stat">💨 OXIGÊNIO<div id="val-oxigenio" class="stat-val">100%</div></div>
        <div class="stat">🗑️ LIXO NA COLÔNIA<div id="val-lixo" class="stat-val">0</div></div>
    </div>

    <div id="container">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div id="sidebar">
            <h3>Infraestrutura</h3>
            <button class="btn-build" data-type="road">🛑 Estrada Espacial<span class="btn-desc">Conecta os prédios da base.</span><span class="btn-cost">Custo: $10</span></button>
            <button class="btn-build" data-type="solar">☀️ Painel Solar ("Gerador de Luz")<span class="btn-desc">Gera +20 de Energia para a cidade.</span><span class="btn-cost">Custo: $150</span></button>
            
            <h3>Residências</h3>
            <button class="btn-build" data-type="house_small">🏠 Módulo Habitacional<span class="btn-desc">Abriga +10 colonos. Consome 2 de energia.</span><span class="btn-cost">Custo: $100</span></button>
            <button class="btn-build" data-type="house_large">🏢 Condomínio Orbital<span class="btn-desc">Abriga +40 colonos. Consome 6 de energia.</span><span class="btn-cost">Custo: $300</span></button>
            
            <h3>Indústria e Lazer</h3>
            <button class="btn-build" data-type="factory">🏭 Fábrica Quântica<span class="btn-desc">Gera +50 créditos, mas produz LIXO e gasta energia.</span><span class="btn-cost">Custo: $250</span></button>
            <button class="btn-build" data-type="park">🎄 Praça Bio-Domo<span class="btn-desc">Limpa o lixo ao redor e melhora o Oxigênio.</span><span class="btn-cost">Custo: $120</span></button>

            <h3 style="margin-top:15px; color:#ff4a4a;">Limpeza</h3>
            <button class="btn-build" data-type="cleaner" style="border-color:#ff4a4a;">🧹 Coletar Lixo Manual<span class="btn-desc">Clique nos blocos com lixo acumulado para limpar.</span><span class="btn-cost">Custo: Grátis</span></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuração do Grid
        const TILE_SIZE = 40;
        let GRID_WIDTH = 0;
        let GRID_HEIGHT = 0;
        let grid = [];

        // Recursos Globais
        let recursos = { creditos: 1000, populacao: 0, energiaGera: 0, energiaGasta: 0, oxigenio: 100, lixoTotal: 0 };
        let selectedTool = null;

        // Configurações de Construção
        const BUILDINGS = {
            road: { cost: 10, color: '#334155', label: '═' },
            solar: { cost: 150, color: '#eab308', label: '⚡', energiaGera: 20 },
            house_small: { cost: 100, color: '#3b82f6', label: '🏠', pop: 10, energiaGasta: 2 },
            house_large: { cost: 300, color: '#8b5cf6', label: '🏢', pop: 40, energiaGasta: 6 },
            factory: { cost: 250, color: '#ef4444', label: '🏭', receita: 50, energiaGasta: 8, lixoGera: 3 },
            park: { cost: 120, color: '#10b981', label: '🎄', oxigenioGera: 2 }
        };

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            GRID_WIDTH = Math.floor(canvas.width / TILE_SIZE);
            GRID_HEIGHT = Math.floor(canvas.height / TILE_SIZE);
            
            // Inicializa grid vazio se estiver vazio
            if(grid.length === 0) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    grid[x] = [];
                    for (let y = 0; y < GRID_HEIGHT; y++) {
                        grid[x][y] = { type: null, lixo: 0 };
                    }
                }
            }
        }

        // Seleção de Ferramentas da Interface
        document.querySelectorAll('.btn-build').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-build').forEach(b => b.classList.remove('selected'));
                const type = btn.getAttribute('data-type');
                if (selectedTool === type) {
                    selectedTool = null;
                } else {
                    selectedTool = type;
                    btn.classList.add('selected');
                }
            });
        });

        // Clique no Grid para Construir ou Limpar
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const gX = Math.floor(mouseX / TILE_SIZE);
            const gY = Math.floor(mouseY / TILE_SIZE);

            if (gX >= 0 && gX < GRID_WIDTH && gY >= 0 && gY < GRID_HEIGHT) {
                processarCliqueGrid(gX, gY);
            }
        });

        function processarCliqueGrid(x, y) {
            let bloco = grid[x][y];

            // Ação de Limpeza Manual de Lixo
            if (selectedTool === 'cleaner') {
                if (bloco.lixo > 0) {
                    bloco.lixo = 0;
                }
                return;
            }

            if (!selectedTool) return;

            // Se já tiver construção, não sobrescreve direto
            if (bloco.type !== null) return;

            let dadosPredio = BUILDINGS[selectedTool];
            if (recursos.creditos >= dadosPredio.cost) {
                recursos.creditos -= dadosPredio.cost;
                bloco.type = selectedTool;
                atualizarSimulacao();
            }
        }

        function atualizarSimulacao() {
            let gasta = 0;
            let gera = 0;
            let pop = 0;
            let qtdFabricas = 0;
            let qtdPracas = 0;

            for (let x = 0; x < GRID_WIDTH; x++) {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    let b = grid[x][y].type;
                    if (!b) continue;
                    if (BUILDINGS[b].energiaGasta) gasta += BUILDINGS[b].energiaGasta;
                    if (BUILDINGS[b].energiaGera) gera += BUILDINGS[b].energiaGera;
                    if (BUILDINGS[b].pop) pop += BUILDINGS[b].pop;
                    if (b === 'factory') qtdFabricas++;
                    if (b === 'park') qtdPracas++;
                }
            }

            recursos.energiaGasta = gasta;
            recursos.energiaGera = gera;
            recursos.populacao = pop;
        }

        // Loop de ciclo econômico (Acontece a cada 3 segundos)
        setInterval(() => {
            let totalLixoCenario = 0;
            let receitaTotal = 0;
            let fabricasAtivas = 0;
            let pracasAtivas = 0;

            // 1. Processar cada bloco do mapa
            for (let x = 0; x < GRID_WIDTH; x++) {
                for (let y = 0; y < GRID_HEIGHT; y++) {
                    let bloco = grid[x][y];
                    
                    if (bloco.type === 'factory') {
                        fabricasAtivas++;
                        receitaTotal += BUILDINGS.factory.receita;
                        // Fábricas jogam lixo nela mesma e espalham ao redor
                        bloco.lixo = Math.min(10, bloco.lixo + 1);
                        espalharLixoAoRedor(x, y);
                    }
Use o código com cuidado.
if (bloco.type === 'park') {
pracasAtivas++;
limparLixoAoRedor(x, y);
}
totalLixoCenario += bloco.lixo;
}
}
// Se faltar energia, as fábricas rendem metade do lucro
if (recursos.energiaGasta > recursos.energiaGera) {
receitaTotal = Math.floor(receitaTotal * 0.3);
}
// Atualiza Balanço Geral
recursos.creditos += receitaTotal;
recursos.lixoTotal = totalLixoCenario;
// Cálculo do Oxigênio baseado no lixo e praças
let impactoLixo = recursos.lixoTotal * 0.5;
let bonusPracas = pracasAtivas * 5;
recursos.oxigenio = Math.max(10, Math.min(100, Math.floor(100 - impactoLixo + bonusPracas)));
atualizarUI();
}, 3000);
function espalharLixoAoRedor(cx, cy) {
const vizinhos = [[0,1], [0,-1], [1,0], [-1,0]];
vizinhos.forEach(([dx, dy]) => {
let nx = cx + dx;
let ny = cy + dy;
if (nx >= 0 && nx < GRID_WIDTH && ny >= 0 && ny < GRID_HEIGHT) {
if (Math.random() > 0.4) {
grid[nx][ny].lixo = Math.min(10, grid[nx][ny].lixo + 1);
}
}
});
}
function limparLixoAoRedor(cx, cy) {
const alcance = [-1, 0, 1];
alcance.forEach(dx => {
alcance.forEach(dy => {
let nx = cx + dx;
let ny = cy + dy;
if (nx >= 0 && nx < GRID_WIDTH && ny >= 0 && ny < GRID_HEIGHT) {
if(grid[nx][ny].lixo > 0) grid[nx][ny].lixo--;
}
});
});
}
function atualizarUI() {
document.getElementById('val-creditos').innerText = $${recursos.creditos};
document.getElementById('val-pop').innerText = ${recursos.populacao} Hab;
const elEnergia = document.getElementById('val-energia');
elEnergia.innerText = ${recursos.energiaGasta} / ${recursos.energiaGera} MW;
if(recursos.energiaGasta > recursos.energiaGera) elEnergia.classList.add('alerta');
else elEnergia.classList.remove('alerta');
const elO2 = document.getElementById('val-oxigenio');
elO2.innerText = ${recursos.oxigenio}%;
if(recursos.oxigenio < 40) elO2.classList.add('alerta');
else elO2.classList.remove('alerta');
const elLixo = document.getElementById('val-lixo');
elLixo.innerText = ${recursos.lixoTotal};
if(recursos.lixoTotal > 20) elLixo.classList.add('alerta');
else elLixo.classList.remove('alerta');
}
// Renderização Visual (Gráficos em Canvas)
function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Desenha linhas do Grid de fundo espacial
ctx.strokeStyle = '#1e293b';
ctx.lineWidth = 0.5;
for (let x = 0; x < GRID_WIDTH; x++) {
for (let y = 0; y < GRID_HEIGHT; y++) {
let px = x * TILE_SIZE;
let py = y * TILE_SIZE;
ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
let bloco = grid[x][y];
// Se houver lixo jogado no chão, desenha manchas verdes/marrons
if (bloco.lixo > 0) {
ctx.fillStyle = rgba(34, 197, 94, ${bloco.lixo * 0.08});
ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
ctx.fillStyle = '#15803d';
ctx.font = '9px monospace';
ctx.fillText('☣️', px + 4, py + TILE_SIZE - 4);
}
// Se houver prédio construído
if (bloco.type) {
let info = BUILDINGS[bloco.type];
ctx.fillStyle = info.color;
ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
// Detalhe de borda futurista
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 1;
ctx.strokeRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
// Ícone/Texto do prédio
ctx.fillStyle = '#ffffff';
ctx.font = '16px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(info.label, px + TILE_SIZE/2, py + TILE_SIZE/2);
}
}
}
requestAnimationFrame(draw);
}
// Inicialização do Jogo
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
atualizarUI();
draw();
