<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>O Faroleiro - Protótipo</title>
<style>
  * { box-sizing: border-box; font-family: 'Courier New', monospace; }
  body {
    background-color: #080c10;
    color: #c8d6e5;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #start-screen {
    position: fixed; inset: 0;
    background: #05080b;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10; text-align: center; padding: 20px;
  }
  button {
    background: #1e272e; color: #f5f6fa;
    border: 1px solid #485460; padding: 12px 20px;
    font-size: 16px; cursor: pointer; margin-top: 10px;
    transition: 0.2s;
  }
  button:hover { background: #ffa801; color: #000; border-color: #ffa801; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #game-container {
    width: 100%; max-width: 850px;
    border: 2px solid #2f3640;
    background: #0d131a;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
  }
  header {
    display: flex; justify-content: space-between;
    border-bottom: 1px solid #2f3640; padding-bottom: 10px;
    margin-bottom: 20px; font-size: 18px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .panel {
    border: 1px solid #2f3640; padding: 15px;
    background: #111922;
  }
  .panel h2 { margin-top: 0; font-size: 16px; color: #ffa801; border-bottom: 1px solid #2f3640; padding-bottom: 5px; }
  .bar-bg { width: 100%; height: 18px; background: #1e272e; margin: 8px 0 15px; border: 1px solid #485460; }
  .bar-fill { height: 100%; transition: width 0.3s; }
  #fuel-bar { background: #e1b12c; width: 100%; }
  #san-bar { background: #4cd137; width: 100%; }
  #beacon-status { font-weight: bold; color: #4cd137; }
  .danger { color: #e84118 !important; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* Rádio */
  input[type=range] { width: 100%; margin: 15px 0; accent-color: #ffa801; }
  #freq-display { font-size: 24px; color: #ffa801; text-align: center; }
  #signal-meter { text-align: center; font-size: 13px; margin-bottom: 10px; color: #808e9b; }
  #radio-output {
    background: #05080b; border: 1px solid #2f3640;
    padding: 12px; min-height: 90px; color: #0be881;
    font-size: 14px; line-height: 1.4;
  }

  /* Log */
  #log {
    margin-top: 20px; border: 1px solid #2f3640;
    background: #05080b; padding: 10px;
    height: 130px; overflow-y: auto; font-size: 13px;
  }
  .log-entry { margin-bottom: 5px; }
  .log-warn { color: #ff5e57; }
  .log-mystery { color: #0be881; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>O FAROLEIRO</h1>
  <p>Mantenha a luz girando até as 06:00.<br>Não deixe o combustível acabar. Ouça o que vem do mar.</p>
  <button onclick="startGame()">LIGAR ENERGIA DO FAROL</button>
</div>

<div id="game-container">
  <header>
    <div>NOITE 1 — <span id="clock">00:00</span></div>
    <div>FAROL: <span id="beacon-status">ATIVO</span></div>
  </header>

  <div class="grid">
    <!-- Painel de Manutenção -->
    <div class="panel">
      <h2>PAINEL DA TORRE</h2>
      <div>Combustível da Lâmpada: <span id="fuel-text">100%</span></div>
      <div class="bar-bg"><div id="fuel-bar" class="bar-fill"></div></div>

      <div>Estabilidade Mental: <span id="san-text">100%</span></div>
      <div class="bar-bg"><div id="san-bar" class="bar-fill"></div></div>

      <button id="btn-refuel" onclick="refuel()">Bombear Óleo (+30%)</button>
      <button id="btn-fix" onclick="fixFuse()" disabled>Religar Disjuntor</button>
    </div>

    <!-- Painel do Rádio -->
    <div class="panel">
      <h2>RÁDIO DE ONDAS CURTAS</h2>
      <div id="freq-display">94.0 MHz</div>
      <input type="range" id="freq-slider" min="88.0" max="108.0" step="0.2" value="94.0" oninput="updateRadio()">
      <div id="signal-meter">SINAL: ESTÁTICA PURA</div>
      <div id="radio-output">...chiado...</div>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
  let fuel = 100;
  let sanity = 100;
  let minutes = 0; // 0 = 00:00, 360 = 06:00
  let fuseBroken = false;
  let gameOver = false;
  let gameLoop;

  // Áudio Procedural (Web Audio API)
  let audioCtx, noiseGain, toneOsc, toneGain;

  const signals = [
    { freq: 91.4, found: false, text: "[CÓDIGO MORSE DECIFRADO]: 'NAVIO AURORA... SEM TRIPULAÇÃO A BORDO... ESTAMOS DERIVA...'" },
    { freq: 98.8, found: false, text: "[VOZ DISTORCIDA]: 'Não olhe para a água quando a luz apagar. Ele sobe pelas pedras.'" },
    { freq: 104.2, found: false, text: "[TRANSMISSÃO DE EMERGÊNCIA]: 'Farol da Ponta Negra, aqui é a Guarda Costeira. Nenhuma embarcação foi autorizada na sua área hoje.'" }
  ];

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Gerador de chiado (estática)
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.03;
    whiteNoise.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    whiteNoise.start();

    // Oscilador para apito de sintonia
    toneOsc = audioCtx.createOscillator();
    toneOsc.type = 'sine';
    toneOsc.frequency.value = 520;
    toneGain = audioCtx.createGain();
    toneGain.gain.value = 0;
    toneOsc.connect(toneGain);
    toneGain.connect(audioCtx.destination);
    toneOsc.start();
  }

  function addLog(msg, type = "") {
    const log = document.getElementById("log");
    const entry = document.createElement("div");
    entry.className = "log-entry " + type;
    entry.textContent = `[${formatTime(minutes)}] ${msg}`;
    log.prepend(entry);
  }

  function formatTime(mins) {
    const h = String(Math.floor(mins / 60)).padStart(2, '0');
    const m = String(mins % 60).padStart(2, '0');
    return `${h}:${m}`;
  }

  function startGame() {
    document.getElementById("start-screen").style.display = "none";
    initAudio();
    addLog("Turno iniciado. Tempestade se aproximando pelo leste.");
    updateRadio();
    gameLoop = setInterval(tick, 1000);
  }

  function tick() {
    if (gameOver) return;

    minutes += 3; // Cada segundo real = 3 minutos no jogo (2 min reais = 6h de turno)
    document.getElementById("clock").textContent = formatTime(minutes);

    // Vitória às 06:00
    if (minutes >= 360) {
      endGame("AMANHECEU! Você sobreviveu à primeira noite no farol.");
      return;
    }

    // Evento aleatório de pane no disjuntor
    if (!fuseBroken && Math.random() < 0.06) {
      fuseBroken = true;
      document.getElementById("btn-fix").disabled = false;
      addLog("ALERTA: Um raio atingiu a torre! O disjuntor desarmou!", "log-warn");
    }

    // Consumo de combustível e impacto na sanidade
    const lightOn = fuel > 0 && !fuseBroken;
    const statusEl = document.getElementById("beacon-status");

    if (lightOn) {
      fuel = Math.max(0, fuel - 1.4);
      statusEl.textContent = "ATIVO";
      statusEl.className = "";
    } else {
      sanity = Math.max(0, sanity - 3.5);
      statusEl.textContent = "APAGADO (PERIGO)";
      statusEl.className = "danger";
      if (Math.random() < 0.3) addLog("Passos pesados ecoam na escada em espiral no escuro...", "log-warn");
    }

    updateUI();

    if (sanity <= 0) {
      endGame("FIM DE JOGO: A escuridão tomou conta da sua mente. Ninguém nunca mais encontrou o faroleiro.");
    }
  }

  function updateUI() {
    document.getElementById("fuel-text").textContent = Math.round(fuel) + "%";
    document.getElementById("fuel-bar").style.width = fuel + "%";
    document.getElementById("san-text").textContent = Math.round(sanity) + "%";
    document.getElementById("san-bar").style.width = sanity + "%";
  }

  function refuel() {
    if (gameOver) return;
    fuel = Math.min(100, fuel + 30);
    addLog("Óleo bombeado para o reservatório da lâmpada.");
    updateUI();
  }

  function fixFuse() {
    if (!fuseBroken || gameOver) return;
    fuseBroken = false;
    document.getElementById("btn-fix").disabled = true;
    addLog("Disjuntor religado. O feixe de luz voltou a girar.");
  }

  function updateRadio() {
    const val = parseFloat(document.getElementById("freq-slider").value);
    document.getElementById("freq-display").textContent = val.toFixed(1) + " MHz";

    let closest = null;
    let minDiff = 999;

    signals.forEach(s => {
      const diff = Math.abs(val - s.freq);
      if (diff < minDiff) { minDiff = diff; closest = s; }
    });

    const meter = document.getElementById("signal-meter");
    const output = document.getElementById("radio-output");

    if (minDiff === 0) {
      meter.textContent = "SINAL: CLARO (100%)";
      meter.style.color = "#0be881";
      output.textContent = closest.text;
      if (noiseGain) noiseGain.gain.value = 0.005;
      if (toneGain) toneGain.gain.value = 0.03;
      if (!closest.found) {
        closest.found = true;
        addLog(`Nova transmissão interceptada em ${closest.freq} MHz!`, "log-mystery");
      }
    } else if (minDiff <= 1.2) {
      meter.textContent = "SINAL: INTERFERÊNCIA PRÓXIMA...";
      meter.style.color = "#ffa801";
      output.textContent = "...bzzzt... algo está transmitindo perto desta frequência... krrrr...";
      if (noiseGain) noiseGain.gain.value = 0.04;
      if (toneGain) toneGain.gain.value = 0.015;
    } else {
      meter.textContent = "SINAL: ESTÁTICA PURA";
      meter.style.color = "#808e9b";
      output.textContent = "...chiado... vento e ondas... chiado...";
      if (noiseGain) noiseGain.gain.value = 0.025;
      if (toneGain) toneGain.gain.value = 0;
    }
  }
