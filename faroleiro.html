<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Faroleiro — Versão 3.0</title>
<style>
  * { box-sizing: border-box; font-family: 'Courier New', monospace; user-select: none; }
  body {
    background-color: #05080c;
    color: #c8d6e5;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  #start-screen, #transition-screen, #end-screen {
    position: fixed; inset: 0;
    background: rgba(4, 7, 11, 0.96);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 999; text-align: center; padding: 20px;
  }
  #transition-screen, #end-screen { display: none; }

  h1 { color: #ffa801; letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,168,1,0.4); }
  .subtitle { max-width: 560px; line-height: 1.6; color: #95afc0; margin-bottom: 20px; }

  /* Recorte de Jornal na transição entre noites */
  .newspaper-clip {
    background: #dcd3b8;
    color: #1a1815;
    max-width: 520px;
    padding: 18px 22px;
    border: 2px solid #8c7f65;
    box-shadow: 0 8px 25px rgba(0,0,0,0.85);
    margin-bottom: 22px;
    text-align: left;
    transform: rotate(-0.8deg);
  }
  .news-header {
    border-bottom: 2px solid #1a1815;
    padding-bottom: 5px;
    margin-bottom: 10px;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }
  .news-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
  .news-body { font-size: 13px; line-height: 1.5; }

  button {
    background: #161f29; color: #f5f6fa;
    border: 1px solid #485460; padding: 12px 20px;
    font-size: 14px; font-weight: bold; cursor: pointer;
    transition: 0.15s; text-transform: uppercase;
  }
  button:hover:not(:disabled) { background: #ffa801; color: #05080c; border-color: #ffa801; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  #game-wrapper {
    width: 100%; max-width: 960px;
    background: #0b1017;
    border: 2px solid #222d3a;
    box-shadow: 0 0 40px rgba(0,0,0,0.95);
    padding: 16px;
  }

  .top-hud {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #222d3a; padding-bottom: 10px; margin-bottom: 14px;
    font-size: 15px; flex-wrap: wrap; gap: 8px;
  }
  .badge { padding: 3px 8px; background: #131c26; border: 1px solid #2f3e4e; }
  .storm-alert { color: #ff6b6b; border-color: #ff6b6b; animation: blink 1s infinite; display: none; }

  .viewport-box {
    position: relative;
    border: 2px solid #1e2833;
    background: #04070d;
    margin-bottom: 16px;
    overflow: hidden;
  }
  canvas#scene { display: block; width: 100%; height: 280px; }

  #subtitle-box {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; background: rgba(5, 8, 13, 0.9);
    border: 1px solid #0be881; color: #0be881;
    padding: 10px 14px; font-size: 14px; text-align: center;
    box-shadow: 0 0 15px rgba(11, 232, 129, 0.25);
    display: none;
  }

  .controls-grid {
    display: grid; grid-template-columns: 1fr 1.35fr; gap: 16px;
  }
  @media (max-width: 760px) { .controls-grid { grid-template-columns: 1fr; } }

  .panel {
    background: #0f1620; border: 1px solid #222d3a; padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .panel-title {
    font-size: 13px; color: #ffa801; letter-spacing: 1px;
    border-bottom: 1px solid #222d3a; padding-bottom: 6px; margin-bottom: 12px;
    display: flex; justify-content: space-between;
  }

  .energy-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .meter-frame {
    width: 100%; height: 24px; background: #070b10;
    border: 1px solid #3d4c5c; padding: 2px; position: relative;
  }
  .meter-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #e1b12c, #fbc531);
    transition: width 0.15s linear, background 0.3s;
  }
  .meter-low {
    background: linear-gradient(90deg, #c23616, #ff4d4d) !important;
    animation: blinkFast 0.45s infinite;
  }

  .sanity-row { margin-top: 14px; }
  .sanity-bar-bg { width: 100%; height: 10px; background: #070b10; border: 1px solid #2f3e4e; margin-top: 4px; }
  .sanity-fill { height: 100%; width: 100%; background: #0be881; transition: width 0.2s; }

  .btn-group { display: flex; gap: 8px; margin-top: 14px; }
  .btn-group button { flex: 1; }
  #btn-gen.active-gen { background: #ffa801; color: #000; border-color: #fff; }

  .radio-top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  canvas#oscilloscope {
    background: #040907; border: 1px solid #1e3b2f;
    width: 150px; height: 54px; flex-shrink: 0;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .osc-near {
    border-color: #ffa801 !important;
    animation: pulseGlow 0.7s infinite alternate;
  }
  .osc-locked {
    border-color: #0be881 !important;
    box-shadow: 0 0 12px rgba(11, 232, 129, 0.45);
  }

  .signal-status { flex: 1; font-size: 13px; }
  #signal-badge { font-weight: bold; color: #808e9b; display: block; margin-bottom: 4px; }

  .dial-container {
    position: relative; width: 100%; height: 58px;
    background: linear-gradient(180deg, #1b1712 0%, #2a2218 50%, #16120e 100%);
    border: 2px solid #4a3c2c; border-radius: 4px;
    cursor: ew-resize; overflow: hidden;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.9);
  }
  canvas#dial-canvas { width: 100%; height: 100%; display: block; }
  .dial-hint { font-size: 11px; color: #808e9b; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }

  .glitch-box {
    animation: shake 0.15s infinite;
    border-color: #ff6b6b !important;
  }

  /* Log inferior com alto contraste */
  #log-box {
    margin-top: 14px; background: #06090e; border: 1px solid #1e2833;
    height: 92px; overflow-y: auto; padding: 10px 12px; font-size: 13px; line-height: 1.45;
  }
  .log-line { margin-bottom: 5px; color: #b2bec3; }
  .log-warn { color: #ff6b6b; font-weight: bold; }
  .log-good { color: #0be881; }

  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes blinkFast { 50% { opacity: 0.35; } }
  @keyframes pulseGlow {
    from { box-shadow: 0 0 3px rgba(255, 168, 1, 0.2); }
    to { box-shadow: 0 0 14px rgba(255, 168, 1, 0.85); }
  }
  @keyframes shake {
    0% { transform: translate(1px, 0); }
    50% { transform: translate(-1px, 1px); }
    100% { transform: translate(0, -1px); }
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>O FAROLEIRO</h1>
  <p class="subtitle">
    Sobreviva às <b>3 Noites</b> na Ilha da Ponta Negra.<br>
    Segure o gerador para manter a luz girando — mas lembre-se: o motor abafa o rádio.<br>
    Sintonize as frequências ocultas do mar antes do amanhecer.
  </p>
  <button id="btn-start" type="button">INICIAR NOITE 1</button>
</div>

<div id="transition-screen">
  <h1 id="trans-title">06:00 — NOITE 1 CONCLUÍDA</h1>
  <p class="subtitle" id="trans-summary"></p>
  <div class="newspaper-clip">
    <div class="news-header">
      <span>GAZETA COSTEIRA DE PONTA NEGRA</span>
      <span id="news-date">14 DE OUTUBRO, 1974</span>
    </div>
    <div class="news-title" id="news-headline"></div>
    <div class="news-body" id="news-text"></div>
  </div>
  <button id="btn-next-night" type="button">AVANÇAR PARA A PRÓXIMA NOITE</button>
</div>

<div id="end-screen">
  <h1 id="end-title">FIM DO TURNO</h1>
  <p class="subtitle" id="end-desc"></p>
  <button type="button" onclick="location.reload()">REINICIAR JORNADA</button>
</div>
<script>
  let currentNight = 1;
  const maxNights = 3;
  let energy = 85;
  let sanity = 100;
  let minutes = 0;
  let freq = 94.0;
  let isGenerating = false;
  let isStorm = false;
  let stormTimer = 0;
  let lightningFlash = 0;
  let radioGlitched = false;
  let gameOver = false;
  let pausedBetweenNights = false;
  let gameStarted = false;
  let beamAngle = 0;
  let wavePhase = 0;

  const seaEntities = [
    { x: 640, y: 178, type: 'ship', visibleTimer: 0, active: false },
    { x: 780, y: 185, type: 'leviathan', visibleTimer: 0, active: false }
  ];

  // Sinais divididos por noite + texto do jornal para transição
  const nightData = {
    1: {
      drainRate: 0.34,
      stormDrain: 0.62,
      headline: "JORNAL COSTEIRO — EDIÇÃO MATINAL",
      report: "“Guarda Costeira investiga desaparecimento do Cargueiro Vencedor próximo à Ponta Negra. Nenhuma boia de sinalização foi encontrada.”",
      signals: [
        { freq: 90.4, found: false, title: "CARGUEIRO VENCEDOR — 90.4 MHz", text: "“...aqui é o Cargueiro Vencedor... nossas bússolas giram sem parar e a água ao redor do casco está brilhando em verde...”" },
        { freq: 95.8, found: false, title: "TRANSMISSÃO DESCONHECIDA — 95.8 MHz", text: "“[Respiração pesada]... Nós vemos a sua luz girando na torre, faroleiro. Não deixe ela apagar. Elas têm medo do feixe...”" },
        { freq: 101.2, found: false, title: "CÓDIGO MORSE COSTEIRO — 101.2 MHz", text: "“[MORSE DECIFRADO]: ALERTA METEOROLÓGICO. ANOMALIA MAGNÉTICA DETECTADA A 2 MILHAS DO FAROL DA PONTA NEGRA.”" },
        { freq: 106.4, found: false, title: "FREQUÊNCIA SUBMERSA — 106.4 MHz", text: "“[Vozes em coro distorcidas]: O farol antigo afundou há cinquenta anos... quem você acha que acendeu a lâmpada hoje?”" }
      ]
    },
    2: {
      drainRate: 0.42,
      stormDrain: 0.78,
      headline: "DIÁRIO DO FAROLEIRO ANTERIOR — PÁGINA RASGADA",
      report: "“Anotação encontrada sob o assoalho da torre: 'Na segunda noite, o mar sobe até as pedras. Não confie nas vozes que imitam a Guarda Costeira.'”",
      signals: [
        { freq: 89.2, found: false, title: "BOIA METEOROLÓGICA 04 — 89.2 MHz", text: "“[Alerta automático]: Temperatura da água subiu 14 graus em dois minutos. Algo colossal está parado sob o penhasco.”" },
        { freq: 94.6, found: false, title: "VOZ IMITANDO O RÁDIO — 94.6 MHz", text: "“...Faroleiro, aqui é o Supervisor... apague a lâmpada agora... a luz está incomodando quem mora lá embaixo...”" },
        { freq: 100.8, found: false, title: "SUBMARINO DE PESQUISA — 100.8 MHz", text: "“[Interferência]: O sonar detectou dezenas de silhuetas cercando a base do farol. Mantenha o feixe girando!”" },
        { freq: 105.6, found: false, title: "SUSSURRO NAS ONDAS — 105.6 MHz", text: "“[Som de água batendo no vidro]: Estamos olhando pela sua janelinha na base da torre...”" }
      ]
    },
    3: {
      drainRate: 0.50,
      stormDrain: 0.92,
      headline: "MANCHETE ESPECIAL — MISTÉRIO NA PONTA NEGRA",
      report: "“Após três noites de tempestades elétricas sem precedentes, o Farol da Ponta Negra permaneceu aceso até o amanhecer, guiando dezenas de barcos a salvo.”",
      signals: [
        { freq: 91.0, found: false, title: "FROTA PESQUEIRA — 91.0 MHz", text: "“Vemos a sua luz cortando a tempestade! Estamos usando o seu feixe para escapar do nevoeiro!”" },
        { freq: 97.4, found: false, title: "ECO DO FAROL ANTIGO — 97.4 MHz", text: "“[Estática profunda]: O último faroleiro desistiu às 04:00... não cometa o mesmo erro que eu...”" },
        { freq: 102.6, found: false, title: "CHAMADO DAS PROFUNDEZAS — 102.6 MHz", text: "“[Rugido grave seguido de silêncio]: A luz queima... recuando para o abismo...”" },
        { freq: 107.2, found: false, title: "GUARDA COSTEIRA — 107.2 MHz", text: "“Resgate a caminho ao amanhecer, Ponta Negra! Aguente firme até as 06:00!”" }
      ]
    }
  };

  let signals = nightData[1].signals;

  // Estrelas, Nuvens e Gotas de Chuva
  const stars = Array.from({ length: 48 }, () => ({
    x: Math.random() * 920,
    y: Math.random() * 145,
    size: Math.random() * 1.8 + 0.5,
    blinkOffset: Math.random() * Math.PI * 2
  }));

  const clouds = Array.from({ length: 8 }, (_, i) => ({
    x: i * 140,
    y: 20 + Math.random() * 65,
    w: 150 + Math.random() * 110,
    speed: 0.18 + Math.random() * 0.22
  }));

  const raindrops = Array.from({ length: 95 }, () => ({
    x: Math.random() * 920,
    y: Math.random() * 280,
    len: 10 + Math.random() * 10,
    speed: 9 + Math.random() * 6
  }));

  // --- ÁUDIO PROCEDURAL ---
  let audioCtx = null, staticGain = null, toneOsc = null, toneGain = null, genOsc = null, genGain = null, windGain = null;

  function initAudio() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const windNoise = audioCtx.createBufferSource();
      windNoise.buffer = noiseBuffer; windNoise.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'lowpass'; windFilter.frequency.value = 260;
      windGain = audioCtx.createGain(); windGain.gain.value = 0.08;
      windNoise.connect(windFilter); windFilter.connect(windGain); windGain.connect(audioCtx.destination);
      windNoise.start();

      const radioNoise = audioCtx.createBufferSource();
      radioNoise.buffer = noiseBuffer; radioNoise.loop = true;
      const radioFilter = audioCtx.createBiquadFilter();
      radioFilter.type = 'bandpass'; radioFilter.frequency.value = 1400;
      staticGain = audioCtx.createGain(); staticGain.gain.value = 0.03;
      radioNoise.connect(radioFilter); radioFilter.connect(staticGain); staticGain.connect(audioCtx.destination);
      radioNoise.start();

      toneOsc = audioCtx.createOscillator(); toneOsc.type = 'sine'; toneOsc.frequency.value = 480;
      toneGain = audioCtx.createGain(); toneGain.gain.value = 0;
      toneOsc.connect(toneGain); toneGain.connect(audioCtx.destination); toneOsc.start();

      genOsc = audioCtx.createOscillator(); genOsc.type = 'sawtooth'; genOsc.frequency.value = 58;
      const genFilter = audioCtx.createBiquadFilter(); genFilter.type = 'lowpass'; genFilter.frequency.value = 140;
      genGain = audioCtx.createGain(); genGain.gain.value = 0.015;
      genOsc.connect(genFilter); genFilter.connect(genGain); genGain.connect(audioCtx.destination); genOsc.start();
    } catch (e) { console.warn("Áudio não pôde ser iniciado:", e); }
  }

  function playThunderSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 0.65);
      g.gain.setValueAtTime(0.28, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.65);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.66);
    } catch (e) {}
  }

  function playSmackSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.13);
    } catch (e) {}
  }

  // --- CONTROLES E PROGRESSÃO DE NOITES ---
  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    document.getElementById("start-screen").style.display = "none";
    initAudio();
    setupNight(1);
    setInterval(logicTick, 250);
    requestAnimationFrame(renderLoop);
  }

  function setupNight(nightNum) {
    currentNight = nightNum;
    minutes = 0;
    energy = 85;
    sanity = 100;
    isStorm = false;
    stormTimer = 0;
    radioGlitched = false;
    pausedBetweenNights = false;
    signals = nightData[nightNum].signals;

    document.getElementById("night-label").textContent = `NOITE ${nightNum}`;
    document.getElementById("signals-count").textContent = "0";
    document.getElementById("storm-indicator").style.display = "none";
    document.getElementById("radio-panel").classList.remove("glitch-box");
    document.getElementById("btn-smack").disabled = true;
    document.getElementById("subtitle-box").style.display = "none";
    document.getElementById("log-box").innerHTML = "";
    addLog(`Noite ${nightNum} iniciada. Mantenha a lâmpada acesa até as 06:00.`);
    drawDial();
  }

  function openTransitionScreen() {
    pausedBetweenNights = true;
    isGenerating = false;
    setGenerating(false);
    if (staticGain) staticGain.gain.value = 0;
    if (toneGain) toneGain.gain.value = 0;
    if (genGain) genGain.gain.value = 0;

    const data = nightData[currentNight];
    const foundCount = signals.filter(s => s.found).length;
    document.getElementById("trans-title").textContent = `NOITE ${currentNight} CONCLUÍDA`;
    document.getElementById("trans-stats").textContent = `Sinais interceptados nesta noite: ${foundCount}/4 | Energia restante: ${Math.round(energy)}%`;
    document.getElementById("journal-headline").textContent = data.headline;
    document.getElementById("journal-text").textContent = data.report;

Use o código com cuidado.
const btnNext = document.getElementById("btn-next-night");
btnNext.textContent = currentNight < maxNights ? INICIAR NOITE ${currentNight + 1} : "ENCERRAR EXPEDIENTE";
document.getElementById("transition-screen").style.display = "flex";
}
document.getElementById("btn-next-night").addEventListener("click", () => {
document.getElementById("transition-screen").style.display = "none";
if (currentNight < maxNights) {
setupNight(currentNight + 1);
} else {
finishGame(true, "Você sobreviveu às 3 noites na Ponta Negra e decifrou os mistérios que emergiram do oceano.");
}
});
document.getElementById("btn-start").addEventListener("click", startGame);
const btnGen = document.getElementById("btn-gen");
function setGenerating(state) {
if (gameOver || pausedBetweenNights) return;
isGenerating = state;
if (state) {
btnGen.classList.add("active-gen");
btnGen.textContent = "⚙️ GERANDO ENERGIA (RÁDIO ABAFADO)...";
} else {
btnGen.classList.remove("active-gen");
btnGen.textContent = "⚡ SEGURAR P/ ABASTECER";
}
}
btnGen.addEventListener("mousedown", () => setGenerating(true));
btnGen.addEventListener("mouseup", () => setGenerating(false));
btnGen.addEventListener("mouseleave", () => setGenerating(false));
btnGen.addEventListener("touchstart", e => { e.preventDefault(); setGenerating(true); });
btnGen.addEventListener("touchend", () => setGenerating(false));
document.getElementById("btn-smack").addEventListener("click", () => {
if (!radioGlitched || gameOver || pausedBetweenNights) return;
playSmackSound();
radioGlitched = false;
document.getElementById("radio-panel").classList.remove("glitch-box");
document.getElementById("btn-smack").disabled = true;
addLog("Você deu uma batida firme na carcaça do rádio. O sinal estabilizou.", "log-good");
});
const dialCanvas = document.getElementById("dial-canvas");
let draggingDial = false;
function updateFreqFromEvent(clientX) {
const rect = dialCanvas.getBoundingClientRect();
const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
freq = Math.round((88.0 + ratio * 20.0) * 5) / 5;
document.getElementById("freq-readout").textContent = freq.toFixed(1) + " MHz";
drawDial();
}
dialCanvas.addEventListener("mousedown", e => { draggingDial = true; updateFreqFromEvent(e.clientX); });
window.addEventListener("mousemove", e => { if (draggingDial) updateFreqFromEvent(e.clientX); });
window.addEventListener("mouseup", () => { draggingDial = false; });
dialCanvas.addEventListener("touchstart", e => { if (e.touches && e.touches.length > 0) { draggingDial = true; updateFreqFromEvent(e.touches[0].clientX); } });
window.addEventListener("touchmove", e => { if (draggingDial && e.touches && e.touches.length > 0) updateFreqFromEvent(e.touches[0].clientX); });
window.addEventListener("touchend", () => { draggingDial = false; });
window.addEventListener("keydown", e => {
if (e.key === "ArrowLeft") { freq = Math.max(88.0, Math.round((freq - 0.2) * 10) / 10); drawDial(); }
if (e.key === "ArrowRight") { freq = Math.min(108.0, Math.round((freq + 0.2) * 10) / 10); drawDial(); }
document.getElementById("freq-readout").textContent = freq.toFixed(1) + " MHz";
});
// --- LOOP LÓGICO ---
function logicTick() {
if (gameOver || pausedBetweenNights) return;
minutes += 0.625;
const h = String(Math.floor(minutes / 60)).padStart(2, '0');
const m = String(Math.floor(minutes % 60)).padStart(2, '0');
document.getElementById("clock").textContent = ${h}:${m};
if (minutes >= 360) {
openTransitionScreen();
return;
}
// Tempestade Elétrica
if (!isStorm && Math.random() < (0.007 + currentNight * 0.002)) {
isStorm = true;
stormTimer = 48;
lightningFlash = 1.0;
playThunderSound();
document.getElementById("storm-indicator").style.display = "inline-block";
addLog("ALERTA: Tempestade elétrica! Nuvens cobriram o céu e a drenagem aumentou.", "log-warn");
if (windGain) windGain.gain.value = 0.18;
} else if (isStorm) {
stormTimer--;
if (Math.random() < 0.045) {
lightningFlash = 0.85;
playThunderSound();
}
if (stormTimer <= 0) {
isStorm = false;
document.getElementById("storm-indicator").style.display = "none";
addLog("A tempestade se afastou e as estrelas voltaram a aparecer.");
if (windGain) windGain.gain.value = 0.08;
}
}
// Falha no rádio
if (!radioGlitched && Math.random() < (0.006 + currentNight * 0.002)) {
radioGlitched = true;
document.getElementById("radio-panel").classList.add("glitch-box");
document.getElementById("btn-smack").disabled = false;
addLog("INTERFERÊNCIA: Válvula do rádio travou! Dê uma batidinha no aparelho.", "log-warn");
}
// Silhuetas no mar
if (Math.random() < 0.014) {
const target = seaEntities[Math.floor(Math.random() * seaEntities.length)];
if (!target.active) { target.active = true; target.visibleTimer = 40; }
}
// Energia
const nCfg = nightData[currentNight];
if (isGenerating) {
energy = Math.min(100, energy + 2.2);
if (genGain) genGain.gain.value = 0.14;
if (genOsc) genOsc.frequency.value = 82;
} else {
const drain = isStorm ? nCfg.stormDrain : nCfg.drainRate;
energy = Math.max(0, energy - drain);
if (genGain) genGain.gain.value = energy > 0 ? 0.015 : 0;
if (genOsc) genOsc.frequency.value = 55;
}
// Sanidade
if (energy <= 0) {
sanity = Math.max(0, sanity - 1.4);
document.getElementById("gen-status-txt").textContent = "APAGADO!";
document.getElementById("gen-status-txt").style.color = "#ff6b6b";
} else if (energy < 20) {
sanity = Math.max(0, sanity - 0.35);
document.getElementById("gen-status-txt").textContent = "ENERGIA CRÍTICA";
document.getElementById("gen-status-txt").style.color = "#ff6b6b";
} else {
sanity = Math.min(100, sanity + 0.15);
document.getElementById("gen-status-txt").textContent = isGenerating ? "ABASTECENDO..." : "ESTÁVEL";
document.getElementById("gen-status-txt").style.color = "#0be881";
}
if (sanity <= 0) {
finishGame(false, Noite ${currentNight}: A luz do farol se apagou por tempo demais. Algo subiu pelas pedras até a sala de controle.);
return;
}
updateBarsAndRadio();
}
function getSignalProximity() {
let closest = null, minDiff = 999;
signals.forEach(s => {
const diff = Math.abs(freq - s.freq);
if (diff < minDiff) { minDiff = diff; closest = s; }
});
return { closest, minDiff };
}
function updateBarsAndRadio() {
const ePct = Math.round(energy);
document.getElementById("energy-pct").textContent = ePct + "%";
const eBar = document.getElementById("energy-bar");
eBar.style.width = ePct + "%";
if (ePct <= 20) eBar.classList.add("meter-low"); else eBar.classList.remove("meter-low");
const sPct = Math.round(sanity);
document.getElementById("sanity-pct").textContent = sPct + "%";
const sBar = document.getElementById("sanity-bar");
sBar.style.width = sPct + "%";
sBar.style.background = sPct < 30 ? "#ff6b6b" : "#0be881";
const subBox = document.getElementById("subtitle-box");
const sigBadge = document.getElementById("signal-badge");
const radioHint = document.getElementById("radio-hint");
const oscEl = document.getElementById("oscilloscope");
oscEl.classList.remove("osc-near", "osc-locked");
if (isGenerating) {
sigBadge.textContent = "RÁDIO ABAFADO PELO MOTOR"; sigBadge.style.color = "#ffa801";
radioHint.textContent = "Solte o botão do gerador para ouvir a frequência.";
subBox.style.display = "none";
if (staticGain) staticGain.gain.value = 0.005;
if (toneGain) toneGain.gain.value = 0;
return;
}
if (radioGlitched) {
sigBadge.textContent = "FALHA DE VÁLVULA (CHIADO)"; sigBadge.style.color = "#ff6b6b";
radioHint.textContent = "Clique em 'Dar batidinha no rádio' para destravar.";
subBox.style.display = "none";
if (staticGain) staticGain.gain.value = 0.06;
if (toneGain) toneGain.gain.value = 0;
return;
}
const { closest, minDiff } = getSignalProximity();
if (minDiff <= 0.25) {
sigBadge.textContent = "SINAL DETECTADO!"; sigBadge.style.color = "#0be881";
radioHint.textContent = closest.title;
subBox.style.display = "block"; subBox.textContent = closest.text;
oscEl.classList.add("osc-locked");
if (staticGain) staticGain.gain.value = 0.004;
if (toneGain) { toneGain.gain.value = 0.025; toneOsc.frequency.value = 540; }
if (!closest.found) {
closest.found = true;
document.getElementById("signals-count").textContent = signals.filter(x => x.found).length;
addLog(Sinal registrado: ${closest.title}, "log-good");
}
} else if (minDiff <= 1.4) {
sigBadge.textContent = "INTERFERÊNCIA PRÓXIMA..."; sigBadge.style.color = "#ffa801";
radioHint.textContent = "Ajuste fino na agulha vermelha...";
subBox.style.display = "none";
oscEl.classList.add("osc-near");
if (staticGain) staticGain.gain.value = 0.025;
if (toneGain) { toneGain.gain.value = 0.012; toneOsc.frequency.value = 390; }
} else {
sigBadge.textContent = "ESTÁTICA NO CANAL"; sigBadge.style.color = "#808e9b";
radioHint.textContent = "Arraste a agulha vermelha no visor abaixo.";
subBox.style.display = "none";
if (staticGain) staticGain.gain.value = 0.035;
if (toneGain) toneGain.gain.value = 0;
}
}
// --- RENDERIZAÇÃO DO DIAL (COM PULSO NA AGULHA) ---
function drawDial(t = 0) {
const ctx = dialCanvas.getContext("2d");
const w = dialCanvas.width, h = dialCanvas.height;
ctx.clearRect(0, 0, w, h);
const grad = ctx.createLinearGradient(0, 0, 0, h);
grad.addColorStop(0, "#1c1610"); grad.addColorStop(0.5, "#332618"); grad.addColorStop(1, "#18120c");
ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
ctx.strokeStyle = "#d2b48c"; ctx.fillStyle = "#e6cfa8";
ctx.font = "11px Courier New"; ctx.textAlign = "center";
for (let f = 88; f <= 108; f += 0.5) {
const x = ((f - 88) / 20) * (w - 30) + 15;
const isMajor = f % 2 === 0;
const tickH = isMajor ? 16 : 8;
ctx.beginPath(); ctx.moveTo(x, h - 8); ctx.lineTo(x, h - 8 - tickH);
ctx.lineWidth = isMajor ? 1.5 : 1; ctx.stroke();
if (isMajor) ctx.fillText(f, x, 20);
}
const { minDiff } = getSignalProximity();
const isNear = !isGenerating && !radioGlitched && minDiff <= 1.4;
const isLocked = !isGenerating && !radioGlitched && minDiff <= 0.25;
const needleX = ((freq - 88) / 20) * (w - 30) + 15;
const pulse = isNear ? (0.5 + 0.5 * Math.sin(t * 0.015)) : 0;
ctx.strokeStyle = isLocked ? "#0be881" : (isNear ? rgba(255, ${Math.round(80 + pulse * 140)}, 52, 1) : "#ff3f34");
ctx.lineWidth = isNear ? 3.5 : 3;
ctx.beginPath(); ctx.moveTo(needleX, 4); ctx.lineTo(needleX, h - 4); ctx.stroke();
const glowWidth = isNear ? 14 + pulse * 8 : 10;
ctx.fillStyle = isLocked
? "rgba(11, 232, 129, 0.32)"
: (isNear ? rgba(255, 168, 1, ${0.2 + pulse * 0.35}) : "rgba(255, 63, 52, 0.25)");
ctx.fillRect(needleX - glowWidth / 2, 4, glowWidth, h - 8);
}
// --- CENÁRIO ANIMADO E OSCILOSCÓPIO ---
const sceneCanvas = document.getElementById("scene");
const sCtx = sceneCanvas.getContext("2d");
const oscCanvas = document.getElementById("oscilloscope");
const oCtx = oscCanvas.getContext("2d");
function renderLoop(timestamp) {
if (!pausedBetweenNights) {
drawDial(timestamp);
drawScene(timestamp);
drawOscilloscope(timestamp);
}
requestAnimationFrame(renderLoop);
}
function drawScene(t) {
const w = sceneCanvas.width, h = sceneCanvas.height, horizonY = 175;
// 1. Céu (Escurece e fica roxo/cinza na tempestade)
const skyGrad = sCtx.createLinearGradient(0, 0, 0, horizonY);
skyGrad.addColorStop(0, isStorm ? "#07060d" : "#040812");
skyGrad.addColorStop(1, isStorm ? "#191528" : "#0d1b2a");
sCtx.fillStyle = skyGrad; sCtx.fillRect(0, 0, w, horizonY);
// 2. Estrelas (Escondidas durante a tempestade)
if (!isStorm) {
stars.forEach(st => {
const alpha = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.0015 + st.blinkOffset));
sCtx.fillStyle = rgba(235, 245, 255, ${alpha});
sCtx.fillRect(st.x, st.y, st.size, st.size);
});
}
// 3. Nuvens de tempestade (Mais densas e rápidas no temporal)
const activeClouds = isStorm ? clouds.length : 4;
for (let i = 0; i < activeClouds; i++) {
const c = clouds[i];
c.x += isStorm ? c.speed * 4.2 : c.speed;
if (c.x > w + 120) c.x = -c.w - 60;
sCtx.fillStyle = isStorm ? "rgba(14, 12, 22, 0.92)" : "rgba(18, 28, 42, 0.42)";
sCtx.beginPath();
sCtx.ellipse(c.x, c.y, isStorm ? c.w * 0.75 : c.w * 0.5, isStorm ? 26 : 16, 0, 0, Math.PI * 2);
sCtx.fill();
}
// 4. Mar e Ondas
const seaGrad = sCtx.createLinearGradient(0, horizonY, 0, h);
seaGrad.addColorStop(0, isStorm ? "#0a0e1a" : "#071320");
seaGrad.addColorStop(1, "#02060c");
sCtx.fillStyle = seaGrad; sCtx.fillRect(0, horizonY, w, h - horizonY);
wavePhase += isStorm ? 0.055 : 0.018;
for (let layer = 0; layer < 4; layer++) {
const yBase = horizonY + 12 + layer * 22;
sCtx.strokeStyle = rgba(72, 126, 176, ${0.12 + layer * 0.05}); sCtx.lineWidth = 1.5;
sCtx.beginPath();
for (let x = 0; x <= w; x += 15) {
const wy = yBase + Math.sin(x * 0.02 + wavePhase + layer) * (isStorm ? 5.2 : 2.2);
if (x === 0) sCtx.moveTo(x, wy); else sCtx.lineTo(x, wy);
}
sCtx.stroke();
}
// 5. Feixe de Luz e Reflexo
beamAngle += 0.018;
const sweep = Math.sin(beamAngle);
let lightPower = energy > 0 ? 1 : 0;
if (energy > 0 && energy <= 20) lightPower = Math.sin(t * 0.03) > 0 ? 0.55 : 0.12;
const lanternX = 135, lanternY = 78;
if (lightPower > 0 && sweep > -0.35) {
const reachX = 320 + (sweep + 0.35) * 440;
const spreadY = 58;
const beamGrad = sCtx.createLinearGradient(lanternX, lanternY, reachX, horizonY + 25);
beamGrad.addColorStop(0, rgba(255, 235, 150, ${0.65 * lightPower}));
beamGrad.addColorStop(0.6, rgba(255, 220, 110, ${0.22 * lightPower}));
beamGrad.addColorStop(1, "rgba(255, 220, 110, 0)");
sCtx.fillStyle = beamGrad;
sCtx.beginPath(); sCtx.moveTo(lanternX, lanternY - 5); sCtx.lineTo(reachX, horizonY - spreadY);
sCtx.lineTo(reachX, horizonY + spreadY); sCtx.lineTo(lanternX, lanternY + 5); sCtx.closePath(); sCtx.fill();
for (let r = 0; r < 6; r++) {
const rx = reachX - 60 + Math.sin(t * 0.005 + r) * 35, ry = horizonY + 10 + r * 14, rw = 30 + r * 12;
sCtx.fillStyle = rgba(255, 225, 130, ${(0.22 - r * 0.03) * lightPower});
sCtx.fillRect(rx - rw / 2, ry, rw, 2.5);
}
seaEntities.forEach(ent => {
if (!ent.active) return;
const dist = Math.abs(reachX - ent.x);
if (dist < 110) {
sCtx.fillStyle = rgba(4, 8, 14, ${0.88 * lightPower});
if (ent.type === 'ship') {
sCtx.fillRect(ent.x - 28, ent.y - 10, 56, 10); sCtx.fillRect(ent.x - 10, ent.y - 22, 16, 12); sCtx.fillRect(ent.x + 12, ent.y - 18, 6, 8);
} else {
sCtx.beginPath(); sCtx.arc(ent.x, ent.y, 16, Math.PI, 0); sCtx.fill();
sCtx.fillRect(ent.x - 22, ent.y - 24, 5, 24); sCtx.fillRect(ent.x + 16, ent.y - 28, 5, 28);
}
}
ent.visibleTimer--;
if (ent.visibleTimer <= 0) ent.active = false;
});
}
// 6. Penhasco e Farol
sCtx.fillStyle = "#090d14";
sCtx.beginPath(); sCtx.moveTo(0, h); sCtx.lineTo(0, 195); sCtx.lineTo(190, 205); sCtx.lineTo(245, h); sCtx.closePath(); sCtx.fill();
sCtx.fillStyle = "#18202c"; sCtx.fillRect(102, 162, 66, 40);
sCtx.fillStyle = energy > 0 ? "#ffa801" : "#2f3640"; sCtx.fillRect(126, 174, 18, 14);
if (energy > 0) { sCtx.fillStyle = "rgba(255, 168, 1, 0.22)"; sCtx.beginPath(); sCtx.arc(135, 181, 20, 0, Math.PI * 2); sCtx.fill(); }
sCtx.fillStyle = "#222c3a";
sCtx.beginPath(); sCtx.moveTo(112, 162); sCtx.lineTo(122, 88); sCtx.lineTo(148, 88); sCtx.lineTo(158, 162); sCtx.closePath(); sCtx.fill();
sCtx.fillStyle = "#782828";
sCtx.beginPath(); sCtx.moveTo(116, 134); sCtx.lineTo(119, 114); sCtx.lineTo(151, 114); sCtx.lineTo(154, 134); sCtx.closePath(); sCtx.fill();
sCtx.fillStyle = "#0d131a"; sCtx.fillRect(120, 70, 30, 18);
sCtx.beginPath(); sCtx.arc(135, 70, 16, Math.PI, 0); sCtx.fill();
if (lightPower > 0) {
const glow = sCtx.createRadialGradient(lanternX, lanternY, 2, lanternX, lanternY, 28);
glow.addColorStop(0, rgba(255, 250, 200, ${lightPower})); glow.addColorStop(1, "rgba(255, 200, 50, 0)");
sCtx.fillStyle = glow; sCtx.beginPath(); sCtx.arc(lanternX, lanternY, 28, 0, Math.PI * 2); sCtx.fill();
}
   function drawOscilloscope(t) {
    const w = oscCanvas.width, h = oscCanvas.height;
    oCtx.fillStyle = "#040907";
    oCtx.fillRect(0, 0, w, h);

    oCtx.strokeStyle = "#0e291e";
    oCtx.lineWidth = 1;
    oCtx.beginPath();
    oCtx.moveTo(0, h / 2);
    oCtx.lineTo(w, h / 2);
    oCtx.stroke();

    const sigs = nightsData[currentNight].signals;
    let minDiff = 999;
    sigs.forEach(s => {
      const diff = Math.abs(freq - s.freq);
      if (diff < minDiff) minDiff = diff;
    });

    const isClean = !isGenerating && !radioGlitched && minDiff <= 0.25;
    const isNear = !isGenerating && !radioGlitched && minDiff <= 1.4;

    oCtx.strokeStyle = isClean ? "#0be881" : (isNear ? "#ffa801" : "#2ed573");
    oCtx.lineWidth = isClean ? 2 : 1.3;
    oCtx.beginPath();

    for (let x = 0; x < w; x += 3) {
      let y = h / 2;
      if (isGenerating) {
        y += Math.sin(x * 0.4 + t * 0.05) * 14 + (Math.random() - 0.5) * 10;
      } else if (isClean) {
        y += Math.sin(x * 0.14 + t * 0.015) * 16;
      } else if (isNear) {
        y += Math.sin(x * 0.14 + t * 0.015) * 10 + (Math.random() - 0.5) * 14;
      } else {
        y += (Math.random() - 0.5) * 26;
      }

      if (x === 0) oCtx.moveTo(x, y);
      else oCtx.lineTo(x, y);
    }
    oCtx.stroke();
  }

  function addLog(msg, cls = "") {
    const box = document.getElementById("log-box");
    const line = document.createElement("div");
    line.className = "log-line " + cls;
    const h = String(Math.floor(minutes / 60)).padStart(2, '0');
    const m = String(Math.floor(minutes % 60)).padStart(2, '0');
    line.textContent = `[${h}:${m}] ${msg}`;
    box.prepend(line);
  }

  function finishNight(win, desc) {
    gameOver = true;
    isGenerating = false;
    setGenerating(false);

    if (staticGain) staticGain.gain.value = 0;
    if (toneGain) toneGain.gain.value = 0;
    if (genGain) genGain.gain.value = 0;
    if (windGain) windGain.gain.value = 0;

    const endScreen = document.getElementById("end-screen");
    const title = document.getElementById("end-title");
    const journalBox = document.getElementById("journal-box");
    const actionBtn = document.getElementById("end-action-btn");

    if (win) {
      const nData = nightsData[currentNight];
      const foundCount = nData.signals.filter(x => x.found).length;
      title.textContent = `06:00 — ${nData.name} CONCLUÍDA`;
      title.style.color = "#0be881";
      document.getElementById("end-desc").textContent = `${desc} (Sinais decifrados: ${foundCount}/${nData.signals.length})`;
      journalBox.innerHTML = nData.journal;
      journalBox.style.display = "block";

      if (currentNight < 3) {
        actionBtn.textContent = `INICIAR NOITE ${currentNight + 1}`;
        actionBtn.onclick = () => {
          endScreen.style.display = "none";
          startNight(currentNight + 1);
        };
      } else {
        actionBtn.textContent = "JOGAR NOVAMENTE (NOITE 1)";
        actionBtn.onclick = () => location.reload();
      }
    } else {
      title.textContent = "A ESCURIDÃO TOMOU O FAROL";
      title.style.color = "#ff6b6b";
      document.getElementById("end-desc").textContent = desc;
      journalBox.style.display = "none";
      actionBtn.textContent = "TENTAR ESTA NOITE NOVAMENTE";
      actionBtn.onclick = () => {
        endScreen.style.display = "none";
        startNight(currentNight);
      };
    }

    endScreen.style.display = "flex";
  }
</script>
</body>
