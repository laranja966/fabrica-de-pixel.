<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundos Espelhados 2.0</title>
  <style>
    body {
      margin: 0; background: #07070d; color: #fff;
      font-family: 'Courier New', monospace; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh; user-select: none;
    }
    h1 { color: #00ffcc; margin: 4px 0; text-shadow: 2px 2px #ff007f; font-size: 24px; }
    #placar { font-size: 18px; margin-bottom: 8px; }
    canvas { background: #10101e; border: 3px solid #00ffcc; border-radius: 8px; max-width: 96vw; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
    button {
      margin-top: 12px; padding: 14px 34px; font-size: 18px; font-weight: bold;
      background: linear-gradient(90deg, #00bfff, #ff007f); color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <h1>MUNDOS ESPELHADOS 2.0</h1>
  <div id="placar">Pontos: <span id="pts">0</span> | Recorde: <span id="rec">0</span></div>
  <canvas id="c" width="650" height="360"></canvas>
  <button id="btn">⬆ PULAR / PULO DUPLO (ESPAÇO)</button>

  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const elPts = document.getElementById('pts'), elRec = document.getElementById('rec');
    const meio = c.height / 2;
    let rec = localStorage.getItem('recEspelho2') || 0;
    elRec.innerText = rec;

    let p1 = { x: 80, y: meio - 42, w: 24, h: 42, vy: 0, pulos: 0 };
    let p2 = { x: 80, y: meio, w: 24, h: 42, vy: 0, pulos: 0 };
    let obs = [], pts = 0, fim = false, frame = 0, vel = 6.2;

    function pular() {
      if (fim) {
        obs = []; pts = 0; vel = 6.2; fim = false; elPts.innerText = 0;
        p1.y = meio - p1.h; p1.vy = 0; p1.pulos = 0;
        p2.y = meio; p2.vy = 0; p2.pulos = 0;
        loop(); return;
      }
      if (p1.pulos < 2) { p1.vy = -10.5; p1.pulos++; }
      if (p2.pulos < 2) { p2.vy = 10.5; p2.pulos++; }
    }

    document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); pular(); } });
    document.getElementById('btn').onclick = pular;
    c.onclick = pular;

    function desenharPersonagem(p, invertido) {
      ctx.save();
      if (invertido) {
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.scale(1, -1);
        ctx.translate(-(p.x + p.w / 2), -(p.y + p.h / 2));
      }

      const corCabelo = invertido ? '#ff2a55' : '#00bfff';
      const corRoupa = invertido ? '#ffaa00' : '#00ffcc';
      const passo = Math.sin(frame * 0.35) * 5;
      const noAr = p.pulos > 0;

      // Cabelo espetado bonito
      ctx.fillStyle = corCabelo;
      ctx.fillRect(p.x + 2, p.y, 20, 6);
      ctx.fillRect(p.x, p.y + 3, 6, 8);
      ctx.fillRect(p.x + 16, p.y - 3, 6, 5);

      // Rosto e olho brilhante
      ctx.fillStyle = '#ffdbac';
      ctx.fillRect(p.x + 5, p.y + 6, 15, 11);
      ctx.fillStyle = '#111';
      ctx.fillRect(p.x + 15, p.y + 9, 3, 4); // Olho
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x + 16, p.y + 9, 1, 1); // Brilho do olho

      // Roupa (Jaqueta estilosa com detalhe)
      ctx.fillStyle = corRoupa;
      ctx.fillRect(p.x + 5, p.y + 17, 14, 14);
      ctx.fillStyle = '#161625';
      ctx.fillRect(p.x + 10, p.y + 17, 4, 14); // Zíper/faixa da roupa

      // Braços balançando
      ctx.fillStyle = '#ffdbac';
      const bracoY = noAr ? p.y + 12 : p.y + 19 - passo * 0.6;
      ctx.fillRect(p.x + 9, bracoY, 6, 9);

      // Calça e Tênis correndo
      ctx.fillStyle = '#2b2d42';
      if (noAr) {
        ctx.fillRect(p.x + 4, p.y + 31, 7, 7);
        ctx.fillRect(p.x + 13, p.y + 29, 7, 7);
      } else {
        ctx.fillRect(p.x + 5 + passo * 0.5, p.y + 31, 6, 8);
        ctx.fillRect(p.x + 13 - passo * 0.5, p.y + 31, 6, 8);
      }
      // Tênis neon
      ctx.fillStyle = corCabelo;
      ctx.fillRect(p.x + 5 + (noAr ? 0 : passo * 0.5), p.y + 38, 7, 4);
      ctx.fillRect(p.x + 13 - (noAr ? 0 : passo * 0.5), p.y + 38, 7, 4);

      ctx.restore();
    }

    function desenharObstaculo(o) {
      if (o.estilo === 'espinho') {
        // Cristal/Espinho afiado neon
        ctx.fillStyle = '#ff007f';
        ctx.beginPath();
        if (o.lado === 1) {
          ctx.moveTo(o.x, meio);
          ctx.lineTo(o.x + o.w / 2, meio - o.h);
          ctx.lineTo(o.x + o.w, meio);
        } else {
          ctx.moveTo(o.x, meio);
          ctx.lineTo(o.x + o.w / 2, meio + o.h);
          ctx.lineTo(o.x + o.w, meio);
        }
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        // Serra giratória perigosa
        const cx = o.x + o.w / 2;
        const cy = o.lado === 1 ? meio - o.h / 2 : meio + o.h / 2;
        const r = o.w / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(frame * 0.25);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#ff2a55';
        ctx.fillRect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      if (fim) return;
      ctx.clearRect(0, 0, c.width, c.height);

      // Grade de fundo em movimento para dar velocidade
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
      ctx.lineWidth = 1;
      const offsetGrade = (frame * vel) % 40;
      for (let gx = -offsetGrade; gx < c.width; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, c.height); ctx.stroke();
      }

      // Chão laser central brilhante
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(0, meio - 2, c.width, 4);

      // Física P1 (Cima)
      p1.vy += 0.62; p1.y += p1.vy;
      if (p1.y >= meio - p1.h) { p1.y = meio - p1.h; p1.vy = 0; p1.pulos = 0; }

      // Física P2 (Baixo)
      p2.vy -= 0.62; p2.y += p2.vy;
      if (p2.y <= meio) { p2.y = meio; p2.vy = 0; p2.pulos = 0; }

      desenharPersonagem(p1, false);
      desenharPersonagem(p2, true);

      // Gerador de obstáculos difíceis (espinhos altos, serras rápidas e combos)
      frame++;
      const intervalo = Math.max(36, 72 - Math.floor(pts / 2));
      if (frame % intervalo === 0) {
        const padrao = Math.floor(Math.random() * 4);
        const estilo = Math.random() > 0.45 ? 'espinho' : 'serra';
        const h = estilo === 'serra' ? 32 : 34 + Math.random() * 24;
        const w = estilo === 'serra' ? 32 : 26;

        if (padrao === 0) obs.push({ x: c.width, w, h, lado: 1, estilo, extraVel: 0 });
        if (padrao === 1) obs.push({ x: c.width, w, h, lado: 2, estilo, extraVel: 0 });
        if (padrao === 2) { // Duplo simultâneo
          obs.push({ x: c.width, w, h: 32, lado: 1, estilo, extraVel: 0 });
          obs.push({ x: c.width, w, h: 32, lado: 2, estilo, extraVel: 0 });
        }
        if (padrao === 3) { // Combo rápido um logo atrás do outro!
          obs.push({ x: c.width, w: 24, h: 36, lado: 1, estilo: 'espinho', extraVel: 1.2 });
          obs.push({ x: c.width + 130, w: 24, h: 36, lado: 2, estilo: 'espinho', extraVel: 1.2 });
        }
      }

      for (let i = obs.length - 1; i >= 0; i--) {
        let o = obs[i];
        o.x -= (vel + o.extraVel);
        desenharObstaculo(o);

        let p = o.lado === 1 ? p1 : p2;
        let oy = o.lado === 1 ? meio - o.h : meio;
        // Hitbox justa (com pequena margem de 4px para não ser injusto)
        if (p.x + 4 < o.x + o.w - 4 && p.x + p.w - 4 > o.x + 4 && p.y + 4 < oy + o.h - 4 && p.y + p.h - 4 > oy + 4) {
          fim = true;
          if (pts > rec) { rec = pts; localStorage.setItem('recEspelho2', rec); elRec.innerText = rec; }
          ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.fillStyle = '#ff2a55'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
          ctx.fillText('GAME OVER!', c.width / 2, meio - 10);
          ctx.fillStyle = '#fff'; ctx.font = '18px monospace';
          ctx.fillText('Clique na tela ou em PULAR para tentar de novo', c.width / 2, meio + 25);
          return;
        }

        if (o.x + o.w < 0) {
          obs.splice(i, 1);
          pts++; elPts.innerText = pts;
          vel = Math.min(13, 6.2 + pts * 0.12);
        }
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
